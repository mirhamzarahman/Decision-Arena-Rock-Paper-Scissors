<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Decision Arena - a JavaScript Rock Paper Scissors game"
    >

    <title>Decision Arena | Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">
        <header>
            <h1>🎮 Decision Arena</h1>
            <p>Rock Paper Scissors</p>
        </header>

        <section class="game-result" aria-live="polite">
            <p id="result">Choose your move!</p>
        </section>

        <section class="buttons" aria-label="Choose your move">
            <button type="button" onclick="playGame('rock')">
                🪨 Rock
            </button>

            <button type="button" onclick="playGame('paper')">
                📄 Paper
            </button>

            <button type="button" onclick="playGame('scissors')">
                ✂️ Scissors
            </button>
        </section>

        <section class="scoreboard" aria-label="Game score">
            <div>
                <span>You</span>
                <strong id="playerScore">0</strong>
            </div>

            <div>
                <span>Computer</span>
                <strong id="computerScore">0</strong>
            </div>
        </section>

        <button
            type="button"
            class="reset"
            onclick="resetGame()"
        >
            Reset Game
        </button>
    </main>

    <script src="script.js"></script>
</body>
</html>
